name: Release

# Tag-driven release. The main branch never triggers a build by itself —
# only pushing a tag like v2.4.0 produces artifacts and a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - label: macos-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
          - label: macos-amd64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
          - label: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # ─── Cairo install per-platform ───
      - name: Install Cairo (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libcairo2-dev \
            libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libgl1-mesa-dev

      - name: Install Cairo (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$(brew --prefix)/lib -lcairo" >> $GITHUB_ENV

      - name: Install Cairo (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Keep the Windows PATH visible inside the MSYS2 shell: the packaging
          # step below needs the Go toolchain and 7z from the runner image.
          path-type: inherit
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-cairo

      # Ask MSYS2 itself where it lives instead of hardcoding C:\msys64 —
      # setup-msys2 may install under RUNNER_TEMP, and a wrong root here means
      # cgo cannot find cairo and the release binaries never build.
      - name: Configure MSYS2 PATH (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ROOT="$(cygpath -m /ucrt64)"
          echo "$(cygpath -w /ucrt64/bin)" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$ROOT/lib/pkgconfig" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$ROOT/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$ROOT/lib -lcairo" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV

      # ─── Test ───
      - name: Run tests
        run: go test -short -count=1 ./core/ ./geom/ ./paint/ ./gui/ ./graph/ ./prop/ ./ged/

      # ─── Build artifacts ───
      - name: Build designer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -v -ldflags="-s -w" -o silk-designer-${{ matrix.label }}${{ matrix.goos == 'windows' && '.exe' || '' }} design.go

      - name: Build demo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -v -ldflags="-s -w" -o silk-demo-${{ matrix.label }}${{ matrix.goos == 'windows' && '.exe' || '' }} demo.go

      # ─── Package ───
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/silk-${{ matrix.label }}
          cp silk-designer-${{ matrix.label }} dist/silk-${{ matrix.label }}/silk-designer
          cp silk-demo-${{ matrix.label }} dist/silk-${{ matrix.label }}/silk-demo
          cp -r icon dist/silk-${{ matrix.label }}/
          cp README.md LICENSE CHANGELOG.md dist/silk-${{ matrix.label }}/
          cd dist && tar czf silk-${{ matrix.label }}.tar.gz silk-${{ matrix.label }}

      # Runs in the MSYS2 shell so /ucrt64 resolves wherever setup-msys2 put it,
      # and resolves the DLL set with ldd instead of a hand-written list. The
      # old list was both hardcoded to C:\msys64 AND swallowed every failure
      # with "|| true", so a wrong path or a new cairo dependency (harfbuzz,
      # brotli, glib...) shipped a zip that simply refuses to start on a machine
      # without MSYS2 — with no sign of trouble in the build log.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OUT="dist/silk-${{ matrix.label }}"
          mkdir -p "$OUT"
          cp silk-designer-${{ matrix.label }}.exe "$OUT/silk-designer.exe"
          cp silk-demo-${{ matrix.label }}.exe "$OUT/silk-demo.exe"
          cp -r icon "$OUT/"
          cp README.md LICENSE CHANGELOG.md "$OUT/"

          # Copy every MSYS2-provided DLL the binaries actually link against.
          for exe in "$OUT"/*.exe; do
            ldd "$exe" | awk '{print $3}' | grep -iE '^/(ucrt64|mingw64)/' | sort -u | while read -r dll; do
              [ -f "$dll" ] && cp -n "$dll" "$OUT/" || true
            done
          done

          # A package without cairo is dead on arrival; do not publish one.
          if [ ! -f "$OUT/libcairo-2.dll" ]; then
            echo "::error::libcairo-2.dll was not bundled - the release would not start"
            ldd "$OUT/silk-designer.exe" || true
            exit 1
          fi
          echo "bundled DLLs:"; ls -1 "$OUT"/*.dll

          cd dist && 7z a silk-${{ matrix.label }}.zip silk-${{ matrix.label }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: silk-${{ matrix.label }}
          path: dist/silk-${{ matrix.label }}.*
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name 'silk-*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/silk-*.tar.gz
          # Also attach Windows zip — second pattern (separate file pattern):
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}

      - name: Attach Windows zips
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/silk-*.zip
          fail_on_unmatched_files: false
