name: Release

# Tag-driven release. The main branch never triggers a build by itself —
# only a tag matching SilkIDE (for example v0.1.4) produces release artifacts.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
          - label: macos-arm64
            os: macos-15
            goos: darwin
            goarch: arm64
          - label: macos-amd64
            os: macos-15-intel
            goos: darwin
            goarch: amd64
          - label: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version and SDK module path
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/validate-release-version.sh "$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # ─── Cairo install per-platform ───
      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/install-linux-deps.sh
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> $GITHUB_ENV

      - name: Install Cairo (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$(brew --prefix)/lib -lcairo" >> $GITHUB_ENV

      - name: Install Cairo (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Keep the Windows PATH visible inside the MSYS2 shell: the packaging
          # step below needs the Go toolchain and 7z from the runner image.
          path-type: inherit
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cairo

      # Ask MSYS2 itself where it lives instead of hardcoding C:\msys64 —
      # setup-msys2 may install under RUNNER_TEMP, and a wrong root here means
      # cgo cannot find cairo and the release binaries never build.
      - name: Configure MSYS2 PATH (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ROOT="$(cygpath -m /ucrt64)"
          echo "$(cygpath -w /ucrt64/bin)" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$ROOT/lib/pkgconfig" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$ROOT/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$ROOT/lib -lcairo" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      # ─── Test ───
      - name: Run tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} go test -short -count=1 ./assets/branding/ ./printing/ ./core/ ./geom/ ./paint/ ./gui/ ./graph/ ./prop/ ./ged/ ./decl/ ./cmd/silkide/ ./cmd/silkgen/ ./internal/silkgen/

      - name: Race regression (release gate)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} go test -race -p 1 -short -count=1 ./core/ ./purecairo/ ./paint/ ./gui/ ./cmd/silkide/ ./ide/taskrunner/ ./internal/processutil/

      - name: Win32 SDK race regression
        if: runner.os == 'Windows'
        run: go test -race -count=1 ./win32/

      - name: Pure-Go rendering parity (release gate)
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -tags silk_pure_go ./cairo/ ./purecairo/ ./paint/

      - name: Test release version validation
        shell: bash
        run: bash scripts/test-release-version.sh

      - name: Test platform packaging scripts
        shell: bash
        run: bash scripts/test-platform-scripts.sh

      # ─── Build artifacts ───
      - name: Build designer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -v -ldflags="-s -w ${{ matrix.goos == 'windows' && '-H windowsgui' || '' }}" -o silk-designer-${{ matrix.label }}${{ matrix.goos == 'windows' && '.exe' || '' }} design.go

      - name: Build demo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -v -ldflags="-s -w ${{ matrix.goos == 'windows' && '-H windowsgui' || '' }}" -o silk-demo-${{ matrix.label }}${{ matrix.goos == 'windows' && '.exe' || '' }} demo.go

      - name: Embed Windows IDE icon
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-windows-icon.sh

      - name: Build IDE and generator
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -v -ldflags="-s -w ${{ matrix.goos == 'windows' && '-H windowsgui' || '' }}" -o silkide-${{ matrix.label }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/silkide/
          go build -v -ldflags="-s -w" -o silkgen-${{ matrix.label }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/silkgen/

      - name: Smoke IDE (Linux virtual display)
        if: runner.os == 'Linux'
        run: bash scripts/linux-run-smoke.sh ./silkide-${{ matrix.label }}

      # ─── Package ───
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/silk-${{ matrix.label }}
          cp silk-designer-${{ matrix.label }} dist/silk-${{ matrix.label }}/silk-designer
          cp silk-demo-${{ matrix.label }} dist/silk-${{ matrix.label }}/silk-demo
          cp silkide-${{ matrix.label }} dist/silk-${{ matrix.label }}/silkide
          cp silkgen-${{ matrix.label }} dist/silk-${{ matrix.label }}/silkgen
          cp -r icon dist/silk-${{ matrix.label }}/
          bash scripts/package-silkide-branding.sh '${{ matrix.goos }}' 'dist/silk-${{ matrix.label }}'
          cp README.md LICENSE CHANGELOG.md dist/silk-${{ matrix.label }}/
          cat > dist/silk-${{ matrix.label }}/RUNTIME-DEPENDENCIES.txt <<'EOF'
          The macOS SilkIDE.app includes its native icon and SDK resources, but
          this archive is not a standalone portable distribution.
          macOS: install Cairo with Homebrew (brew install cairo); Homebrew dylibs
          are external dependencies and are not bundled or relocated here.
          These binaries target their CI runner's runtime; compatibility with
          older macOS versions or older Linux glibc is not implied.
          Linux: requires Cairo, X11/OpenGL runtime libraries and an X11/XWayland
          desktop session. File dialogs use zenity; external links use xdg-open.
          Building generated Go applications also requires Go and the platform
          development libraries documented in README.md. gopls/dlv are optional
          separately installed IDE tools, not included in this archive.
          EOF
          cd dist && tar czf silk-${{ matrix.label }}.tar.gz silk-${{ matrix.label }}

      # Runs in the MSYS2 shell so /ucrt64 resolves wherever setup-msys2 put it,
      # and resolves the DLL set with ldd instead of a hand-written list. The
      # old list was both hardcoded to C:\msys64 AND swallowed every failure
      # with "|| true", so a wrong path or a new cairo dependency (harfbuzz,
      # brotli, glib...) shipped a zip that simply refuses to start on a machine
      # without MSYS2 — with no sign of trouble in the build log.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          OUT="dist/silk-${{ matrix.label }}"
          mkdir -p "$OUT"
          cp silk-designer-${{ matrix.label }}.exe "$OUT/silk-designer.exe"
          cp silk-demo-${{ matrix.label }}.exe "$OUT/silk-demo.exe"
          cp silkide-${{ matrix.label }}.exe "$OUT/silkide.exe"
          cp silkgen-${{ matrix.label }}.exe "$OUT/silkgen.exe"
          cp -r icon "$OUT/"
          bash scripts/package-silkide-branding.sh windows "$OUT"
          cp README.md LICENSE CHANGELOG.md "$OUT/"

          bash scripts/bundle-windows-dlls.sh "$OUT"

          cd dist && 7z a silk-${{ matrix.label }}.zip silk-${{ matrix.label }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: silk-${{ matrix.label }}
          path: dist/silk-${{ matrix.label }}.*
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name 'silk-*'

      - name: Checksum release archives
        run: |
          find artifacts -type f \( -name 'silk-*.tar.gz' -o -name 'silk-*.zip' \) -print0 | sort -z | xargs -0 sha256sum | sed -E 's#  artifacts/[^/]+/#  #' > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/silk-*.tar.gz
            artifacts/**/silk-*.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Keep the release private until the packaged Windows executable
          # passes the real desktop smoke test and archive hashes are checked.
          # Publish explicitly with: gh release edit <tag> --draft=false
          draft: true
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
