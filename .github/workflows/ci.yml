name: CI

# Pull-request validation. The main branch is intentionally NOT a trigger
# — pushes to main are local merges, not events that should consume
# Actions minutes. Tag pushes are handled by release.yml.
on:
  pull_request:
    branches: [main, opengl]

jobs:
  test:
    name: Test ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: macos-arm
            os: macos-15
          - label: macos-intel
            os: macos-15-intel
          - label: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    # Default shell. Overridden for Windows where the cairo cgo build
    # has to run inside an MSYS2 ucrt64 environment so pkg-config
    # finds the cairo headers.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          bash scripts/install-linux-deps.sh
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> $GITHUB_ENV

      - name: Install Cairo (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV
          echo "CGO_CFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L$(brew --prefix)/lib -lcairo" >> $GITHUB_ENV

      - name: Install MSYS2 + Cairo (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # Without path-type: inherit the MSYS2 shell drops the Windows PATH,
          # so the "Build silkide (Windows)" step below cannot find the Go
          # installed by actions/setup-go ("go: command not found"). MSYS2
          # paths still come first, so gcc/pkg-config stay UCRT64.
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc

      - name: Configure Windows cgo env
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Hand cgo the MSYS2 pkg-config + ucrt64 toolchain so it
          # can resolve cairo. setup-go's GOROOT/PATH ordering puts
          # the Microsoft runtime in front of ucrt64; clobber that
          # so cgo picks up the gcc we just installed.
          ROOT="$(cygpath -m /ucrt64)"
          echo "PKG_CONFIG_PATH=$ROOT/lib/pkgconfig" >> $GITHUB_ENV
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
          # Derive the Windows path instead of hardcoding C:\msys64:
          # setup-msys2 may install under RUNNER_TEMP rather than the image's
          # preinstalled location, and a wrong entry here silently leaves the
          # cairo DLLs off PATH for anything run outside this shell.
          echo "$(cygpath -w /ucrt64/bin)" >> $GITHUB_PATH

      - name: Vet
        # Existing cross-package geometry/color literals are intentionally
        # unkeyed; keep all other analyzers enabled, matching local QA.
        run: go vet -composites=false ./core/ ./geom/ ./paint/ ./gui/ ./graph/ ./prop/ ./ged/ ./data/ ./driver/ ./device/ ./historian/ ./report/ ./recipe/ ./auth/ ./template/ ./calc/ ./eventlog/ ./gateway/ ./playback/ ./alarmbridge/ ./sim/ ./login/ ./stats/ ./script/ ./locator/ ./filesearch/ ./snippet/ ./buildissues/

      - name: Test platform packaging scripts
        run: bash scripts/test-platform-scripts.sh

      - name: Test SDK without a display (Linux)
        if: runner.os == 'Linux'
        run: env -u DISPLAY -u WAYLAND_DISPLAY go test -short -count=1 ./core/ ./decl/ ./prop/ ./cmd/silkgen/ ./internal/silkgen/

      # Split into groups: building every cgo test binary in one invocation can
      # exhaust the runner (cairo + sqlite amalgamation compile at once).
      - name: Test (core UI)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} go test -short -count=1 ./printing/ ./core/ ./geom/ ./cairo/ ./paint/ ./gui/ ./graph/ ./prop/ ./ged/ ./decl/ ./internal/processutil/

      - name: Verify native GL texture uploads
        if: runner.os != 'Windows'
        env:
          SILK_TEST_NATIVE_RENDER: '1'
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} go test -count=1 -run '^TestGLFWNativeRenderTransfers$' -v ./gui/

      - name: Test (SCADA backend)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} go test -short -count=1 ./data/ ./driver/ ./device/ ./historian/ ./report/ ./recipe/ ./auth/ ./template/ ./calc/ ./eventlog/ ./gateway/ ./playback/ ./alarmbridge/ ./sim/ ./login/ ./stats/ ./script/

      - name: Test (IDE engines)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} go test -short -count=1 ./assets/branding/ ./cmd/silkide/ ./cmd/silkgen/ ./internal/silkgen/ ./locator/ ./filesearch/ ./snippet/ ./buildissues/

      - name: Build legacy entry points
        if: runner.os != 'Windows'
        run: |
          go build -v -o /tmp/silk-designer design.go
          go build -v -o /tmp/silk-demo demo.go

      - name: Build silkide
        if: runner.os != 'Windows'
        run: go build -v -o /tmp/silkide ./cmd/silkide/

      - name: Build silkide (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go build -v -o silkide.exe ./cmd/silkide/

      - name: Smoke silkide (Linux virtual display)
        if: runner.os == 'Linux'
        run: bash scripts/linux-run-smoke.sh /tmp/silkide

      - name: Build silkgen
        run: go build -v ./cmd/silkgen/
